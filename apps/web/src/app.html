<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The site has its own light / dark themes: stops phone browsers'
         forced night mode (Huawei Browser, etc.) from inverting it again. -->
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="description" content="WarThunder Potato Cup 水友赛：报名、对阵、比分、天梯与积分榜" />
    <meta name="apple-mobile-web-app-title" content="Potato Cup" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Potato Cup</title>
    <!-- HarmonyOS Sans SC, split by character range (scripts/fonts.mjs).
         Loaded without blocking the first paint; text shows in the system
         font until it arrives. -->
    <link rel="stylesheet" href="/fonts/harmonyos-sans-sc/fonts.css" media="print" onload="this.media='all'" />
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
