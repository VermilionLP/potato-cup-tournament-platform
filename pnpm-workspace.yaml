packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true

# Security fixes for transitive dependencies (Dependabot). Drop each once
# the parents depend on a fixed version.
# - glob < 14.0.2 (AbortSignal bypass; via postgrator and @fastify/static)
#   and minimatch < 11.0.1 (globparts DoS; via glob).
# - zod < 4.6.6 (memory exhaustion, GHSA-mrhx-c7xc-m3w5; via koa-body 6 in
#   koishi's server plugin, which only checks its own options with it).
# - fflate < 0.7.5 (ZIP64 infinite loop, GHSA-px8p-9vwx-vf98; via satori's
#   opentype.js in the bot's picture cards).
# - file-type < 21.3.1 (ASF infinite loop, GHSA-5v7r-6r5c-r473; via koishi's
#   @cordisjs/plugin-http 0.6, which needs file-type 16's API: given
#   packages/file-type-compat, which offers that API on a fixed file-type).
overrides:
  glob: ^14.0.2
  minimatch: ^11.0.1
  zod: ^4.6.6
  fflate: ^0.7.5
  '@cordisjs/plugin-http>file-type': link:./packages/file-type-compat
